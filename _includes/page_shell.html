<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9fa">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body class="page-shell page-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Yuhao Xu home"><span class="brand__mark">HX</span><span>Yuhao Xu</span></a>
      <nav class="site-nav" aria-label="Primary navigation"><a href="{{ '/' | relative_url }}#work">Work</a><a href="{{ '/' | relative_url }}#notes">Notes</a><a href="{{ '/about/' | relative_url }}">About</a><a class="nav-github" href="https://github.com/Ffffffffchopin">GitHub <span aria-hidden="true">↗</span></a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">◐</button></nav>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer"><div><a class="brand brand--footer" href="{{ '/' | relative_url }}"><span class="brand__mark">HX</span><span>Yuhao Xu</span></a><p>Independent AI research and open systems.</p></div><div class="site-footer__links"><a href="https://github.com/Ffffffffchopin">GitHub</a><a href="https://orcid.org/0009-0006-8165-6520">ORCID</a><a href="mailto:xsy1131585528@gmail.com">Email</a></div><p class="site-footer__small">© {{ 'now' | date: '%Y' }} Yuhao Xu · HsuYugo</p></footer>
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </body>
</html>
